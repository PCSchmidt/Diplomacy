name: gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PYTHONHASHSEED varies the iteration order of set-derived collections.
        # Finding F3: the `diplomacy` library exposes such collections, and unsorted
        # enumeration silently breaks cross-process replay and the D4 ablation.
        # Running the gates under several seeds is the regression test for it.
        hashseed: ["0", "1", "12345", "random"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install diplomacy jsonschema

      - name: Run all gates
        env:
          PYTHONHASHSEED: ${{ matrix.hashseed }}
        run: python run_tests.py

  fingerprint:
    # The determinism property deserves its own job: it must hold ACROSS processes
    # with different hash seeds, which a single matrix entry cannot demonstrate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install diplomacy jsonschema

      - name: Same seed must produce the same game under any hash seed
        run: |
          set -e
          expected=""
          for hs in 0 1 12345 99991; do
            fp=$(PYTHONHASHSEED=$hs python -c "
          from diplomacy_tom.runner import run_game
          from diplomacy_tom import turn_log as tl
          print(tl.replay_fingerprint(run_game(seed=42, max_phases=12)))
          ")
            echo "PYTHONHASHSEED=$hs -> $fp"
            if [ -z "$expected" ]; then
              expected="$fp"
            elif [ "$fp" != "$expected" ]; then
              echo "F3 REGRESSION: fingerprint diverged across hash seeds"
              exit 1
            fi
          done
          echo "determinism holds: $expected"
